<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ironman Training</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#2e2e2e;--text:#f0f0f0;--muted:#888;--accent:#3b82f6}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:80px}
  header{padding:20px 16px 12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
  h1{font-size:18px;font-weight:600;letter-spacing:-.3px}
  .days-until{font-size:12px;color:var(--muted);margin-top:3px}
  .days-count{color:var(--accent);font-weight:600}
  .day-tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-align:center;line-height:1.3}
  .tab.active{color:#fff;border-color:transparent}
  .tab-day{display:block}
  .tab-date{display:block;font-size:10px;opacity:.8}
  main{padding:12px 16px}
  .day-header{margin-bottom:14px}
  .day-name{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .day-subtitle{font-size:13px;color:var(--muted);margin-top:2px}
  .week-note{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:#fcd34d;line-height:1.5}
  .session{border-radius:12px;margin-bottom:10px;overflow:hidden;border:1px solid var(--border)}
  .session-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  .session-color{width:4px;height:40px;border-radius:2px;flex-shrink:0}
  .session-meta{flex:1}
  .session-time{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .session-title{font-size:15px;font-weight:600}
  .session-summary{font-size:12px;color:var(--muted);margin-top:2px}
  .session-chevron{font-size:18px;color:var(--muted);transition:transform .2s}
  .session-chevron.open{transform:rotate(180deg)}
  .session-detail{padding:0 14px 14px;font-size:13px;line-height:1.6;color:#ccc;display:none}
  .session-detail.open{display:block}
  .detail-block{border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;line-height:1.7;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06)}
  .detail-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .zpill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:6px}
  .z2{background:#052e16;color:#4ade80}
  .z3{background:#422006;color:#fdba74}
  .z4{background:#450a0a;color:#f87171}
  .zt{background:#1e1b4b;color:#a5b4fc}
  .log-btn{width:100%;margin-top:10px;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-align:left}
  .log-btn.done{border-color:#10b981;color:#10b981;background:#052e16}
  .log-area{width:100%;margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:13px;resize:none;font-family:inherit;display:none}
  .log-area.open{display:block}
  .save-btn{margin-top:6px;padding:7px 14px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer;display:none}
  .save-btn.open{display:inline-block}
  .nightly{background:var(--surface);border-radius:12px;padding:14px;border:1px solid var(--border);margin-top:4px}
  .nightly-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .nightly-items{display:flex;flex-wrap:wrap;gap:6px}
  .nightly-pill{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surface2);color:#ccc;border:1px solid var(--border)}
  .gear-section{background:var(--surface);border-radius:12px;padding:14px;border:1px solid var(--border);margin-top:10px}
  .gear-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .gear-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .gear-item:last-child{border-bottom:none}
  .gear-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;transition:all .15s}
  .gear-check.checked{background:#10b981;border-color:#10b981}
  .gear-name{font-size:13px;color:var(--text);transition:color .15s}
  .gear-name.checked{color:var(--muted);text-decoration:line-through}
  .gear-reset{font-size:11px;color:var(--muted);margin-top:10px;cursor:pointer;text-align:right;display:block}
  .recipe-section{background:var(--surface);border-radius:12px;padding:14px;border:1px solid var(--border);margin-top:10px}
  .recipe-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .recipe-items{list-style:none;margin-bottom:10px}
  .recipe-items li{font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);color:#ccc}
  .recipe-items li:last-child{border-bottom:none}
  .recipe-step{font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic}
  .macro-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .macro-pill{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:#ccc}
  .rest-card{background:var(--surface);border-radius:12px;padding:20px;text-align:center;border:1px solid var(--border);margin-bottom:10px}
  .rest-emoji{font-size:36px;margin-bottom:8px}
  .rest-title{font-size:16px;font-weight:600;margin-bottom:4px}
  .rest-sub{font-size:13px;color:var(--muted);line-height:1.5}
  .race-banner{background:rgba(30,58,95,.4);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:14px;margin-bottom:14px}
  .race-label-top{font-size:10px;color:#60a5fa;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .race-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .race-item:last-child{border-bottom:none}
  .race-icon{font-size:16px;width:24px;text-align:center}
  .race-name{font-size:13px;font-weight:500;flex:1}
  .race-date{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Ironman Training</h1>
    <div class="days-until"><span class="days-count" id="daysCount">—</span> days to race day · Mar 6, 2027</div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
</header>
<main id="main"></main>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_COLORS={Monday:'#3b82f6',Tuesday:'#10b981',Wednesday:'#f59e0b',Thursday:'#3b82f6',Friday:'#10b981',Saturday:'#f59e0b',Sunday:'#6b7280'};
const DAY_TINTS={Monday:'rgba(59,130,246,.07)',Tuesday:'rgba(16,185,129,.07)',Wednesday:'rgba(245,158,11,.07)',Thursday:'rgba(59,130,246,.07)',Friday:'rgba(16,185,129,.07)',Saturday:'rgba(245,158,11,.07)',Sunday:'rgba(107,114,128,.05)'};

const OATS_RECIPE={
  title:'🥣 Overnight oats — batch prep (6 jars)',
  step:'Mix all ingredients, divide into 6 jars, refrigerate overnight.',
  items:['3 cups oats','5 scoops protein powder','3 cups milk','~800g yogurt (2/3 of tub most weeks)','3 heaped tsp chia seeds'],
  macros:['475 cal','43g protein','51g carbs','12g fat','2.3g fibre']
};

const PLAN={
  Monday:{subtitle:'Spin + threshold run + gym',sessions:[
    {time:'AM',title:'Wake-up mobility',color:'#94a3b8',summary:'Active stretching and upper body activation',
     detail:'Active stretch 5 min → banded pull-ups 2x8 → push-ups 2x10',zone:null},
    {time:'AM',title:'Indoor spin — structured aerobic',color:'#f59e0b',summary:'Light but purposeful — aerobic base without taxing the legs',
     detail:'10 min easy warm-up → 5x (3 min Z3 / 2 min easy) → 5 min cool-down. Total ~35 min. Keep it controlled — you have a threshold run and gym tonight.',zone:'z3'},
    {time:'PM',title:'Threshold run — choose one',color:'#3b82f6',summary:'Three options — all under 45 min, alternate weekly',
     detail:'<div class="detail-block"><div class="detail-label">Option A — Pyramid intervals</div>10 min warm-up → 2 min Z4 / 2 min easy → 4 min Z4 / 4 min easy → 6 min Z4 / 4 min easy → 4 min Z4 / 2 min easy → 2 min Z4 → 5 min cool-down</div><div class="detail-block" style="margin-top:8px"><div class="detail-label">Option B — Tempo cruise</div>10 min warm-up → 4x8 min Z3 with 2 min float recovery → 5 min cool-down</div><div class="detail-block" style="margin-top:8px"><div class="detail-label">Option C — 400m repeats</div>10 min warm-up → 10x 400m hard with 90 sec jog recovery → 5 min cool-down</div>',zone:'z4'},
    {time:'PM',title:'Gym — legs',color:'#a78bfa',summary:'Heavy compound lifting followed by plyometrics and calf work',
     detail:'Box jumps 3x5 → Back squats 3x4 heavy → Bulgarian split squats 3x8 → Single leg step down 3x10 → Lateral lunge 3x10 → Single leg hip bridge 3x12 → Bent knee calf raises 3x15 slow eccentric → Copenhagen raises 3x8',zone:null},
  ],nightly:['Push-ups','Banded pull-ups','Tricep dips','Reverse plank','Tib raises','5 min stretch'],
  gear:{label:'🎒 Pack tonight for tomorrow — swim',items:['Skins','Togs','Water bottle','Goggles','Towel','Spare clothes','Slides']},recipe:null},

  Tuesday:{subtitle:'Assault bike + swim technique',sessions:[
    {time:'AM',title:'Split squat jumps + assault bike',color:'#f97316',summary:'Power and conditioning — max effort sprints',
     detail:'Split squat jumps 2x8 each leg → 8x 20 sec max effort / 10 sec rest → Push-ups 2x10 → Single leg RDL 3x10 → Skater jumps 2x10 each side',zone:null},
    {time:'PM',title:'Swim — technique',color:'#10b981',summary:'Drill or interval session — alternate weekly',
     detail:'<div class="detail-block"><div class="detail-label">Session A — drill focus</div>400m easy warm-up → 4x50m catch-up drill (15s rest) → 4x50m fingertip drag (15s rest) → 4x50m bilateral breathing (15s rest) → 6x100m on 1:45 send-off, hold 1:35 pace → 200m cool-down. ~2.2km</div><div class="detail-block" style="margin-top:8px"><div class="detail-label">Session B — threshold intervals</div>400m easy → 4x200m on 3:30 send-off strong → 4x100m on 1:45 fast → 8x25m sprint on 45 sec → 200m cool-down. ~2.3km</div>',zone:'zt'},
  ],nightly:['Push-ups','Banded pull-ups','Reverse plank','Tib raises','5 min stretch','(skip dips — swim tonight)'],
  gear:null,recipe:null},

  Wednesday:{subtitle:'Morning mobility + bike threshold',sessions:[
    {time:'AM',title:'Morning mobility + Copenhagen',color:'#ec4899',summary:'Hip, calf and spine mobility with Copenhagen raises',
     detail:"Cat-cow 10 reps → Child's pose 30 sec → Seated spinal twist 30 sec each → Standing hip flexor lunge 30 sec each → Bent-knee calf stretch (soleus) 30 sec each → Copenhagen raises 3x8 → Tib raises 3x20 → Straight calf raises 2x15",zone:null},
    {time:'PM',title:'Bike threshold — choose based on weather',color:'#f59e0b',summary:'Over-unders recommended this week — legs recovering from 90km Saturday',
     detail:'<div class="detail-block"><div class="detail-label">Option A — Over-unders (indoor) ⭐ recommended this week</div>10 min warm-up → 3 sets of (3 min Z3 / 1 min Z4 / 3 min Z3 / 1 min Z4) with 5 min easy between sets → 10 min cool-down. Total ~60 min. Controlled effort — lets legs recover while still driving adaptation.</div><div class="detail-block" style="margin-top:8px"><div class="detail-label">Option B — Hill repeats (outdoor, good weather)</div>4-5x climb (500m at 10% fading to 6-7%) with 1.5km easy recovery spin between. Total 60-75 min.</div>',zone:'z4'},
  ],nightly:['Push-ups','Banded pull-ups','Tricep dips','Reverse plank','Tib raises','5 min stretch'],
  gear:{label:'🎒 Pack tonight for tomorrow — long run',items:['NB 1080s','Gels','Water flask + electrolytes','Long sleeve run top','Shorts','Vaseline']},recipe:null},

  Thursday:{subtitle:'Assault bike + long run',weekNote:'First proper run in the 1080s — go easy. Stop if calves tighten. 12km target but protecting the calves is more important than the distance.',
  sessions:[
    {time:'AM',title:'Assault bike — power sprints',color:'#f97316',summary:'Longer rest, true max effort — 12 rounds',
     detail:'12x 20 sec max effort / 40 sec full rest → Push-ups 2x10 → Single leg RDL 3x10 → Isometric split squat hold with calf raise 2x30 sec each leg → Tib raises 3x20',zone:null},
    {time:'PM',title:'Long run — easy aerobic',color:'#3b82f6',summary:'12km in NB 1080s — Z2 only, stop if calves tighten',
     detail:'12km on flat ground in NB 1080s. The 1080s have a higher stack than you\'re used to — your calves need time to adapt to the geometry. Conversational pace throughout. If calves feel overstretched at any point, walk 2 min and stretch, then reassess. Stop and call it a day if it persists — protecting the calves matters more than hitting 12km this week. Build to 14km next week.',zone:'z2'},
  ],nightly:['Push-ups','Banded pull-ups','Tricep dips','Reverse plank','Tib raises','5 min stretch'],
  gear:{label:'🎒 Pack tonight for tomorrow — swim',items:['Skins','Togs','Water bottle','Goggles','Towel','Spare clothes','Slides']},recipe:null},

  Friday:{subtitle:'Sleep in + long swim + full stretch',sessions:[
    {time:'AM',title:'5 min gentle wake-up only',color:'#94a3b8',summary:'Minimal movement — rest is the priority this morning',
     detail:"Superman 2x10 → Thoracic rotation stretch 30 sec each side → Deep squat hold 30 sec. Then back to bed or coffee.",zone:null},
    {time:'PM',title:'Long swim',color:'#10b981',summary:'3-4km aerobic swim — choose a set or go straight',
     detail:'<div class="detail-block"><div class="detail-label">Option A — speed broken set (~3km)</div>400m warm-up → 3x1000m broken as (800m strong / 100m fast / 100m easy) with 3 min rest between → 200m cool-down</div><div class="detail-block" style="margin-top:8px"><div class="detail-label">Option B — endurance broken set (~3.2km)</div>400m warm-up → 4x600m on 90 sec rest, descend pace each rep → 4x100m on 20 sec rest strong → 200m cool-down</div><div class="detail-block" style="margin-top:8px"><div class="detail-label">Ignore both?</div>Just swim 3km non-stop easy.</div>',zone:'z2'},
    {time:'PM',title:'Full body stretch — post swim while warm',color:'#ec4899',summary:'20-30 min full body — hips, calves, spine and back',
     detail:"Cat-cow 10 reps → 90/90 hip stretch 60 sec each side → Pigeon pose 60 sec each → Standing hip flexor lunge 45 sec each → Hamstring seated stretch 45 sec each → Thoracic opener 60 sec → Soleus stretch bent-knee 45 sec each → Straight calf stretch 45 sec each → Child's pose 60 sec → Static Copenhagen plank hold 20-30 sec each side",zone:null},
  ],nightly:['Push-ups','Banded pull-ups','Reverse plank','Tib raises','5 min stretch','(skip dips — swim tonight)'],
  gear:{label:'🎒 Pack tonight for tomorrow — long ride',items:['Gels','Bars and lollies','Water bottle','Lights','Repair bag','Sunglasses','Bumbag (ride essentials)','Nutrition bag (food + fuel)']},recipe:null},

  Saturday:{subtitle:'Long ride 60-70km · brick run',weekNote:'Legs recovering from last week\'s 90km — keep this one to 60-70km, no stops if possible. Focus on consistent effort and fuelling rather than distance.',
  sessions:[
    {time:'AM',title:'Long outdoor ride + brick run',color:'#f59e0b',summary:'60-70km this week — controlled effort, no stops, practice fuelling',
     detail:'60-70km target this week. Mostly flat, target 25 km/h average. Z2 for 80%, allow Z3 on climbs. Fuel every 45 min without stopping — practice grabbing from your BTA mount while moving. Add 15-20 min easy brick run immediately off bike.',zone:'z2'},
  ],nightly:['Push-ups','Tib raises','5 min stretch','(skip dips + pull-ups — rest upper body)'],
  gear:null,recipe:null},

  Sunday:{subtitle:'Full rest + weekly review',sessions:[],nightly:[],
  gear:{label:'🎒 Pack tonight for tomorrow — run + gym + sauna',items:['Running shoes','Water bottle + electrolytes','Running/gym clothes','Towel','Spare clothes (post sauna)','Slides']},
  recipe:OATS_RECIPE}
};

const UPCOMING=[
  {icon:'🏊',name:'Olympic Tri test',date:'Late Sept 2026'},
  {icon:'🏃',name:'Full Marathon',date:'November 2026'},
  {icon:'🚴',name:'70.3',date:'Mid Dec 2026'},
  {icon:'🏅',name:'Ironman — Taupo',date:'Mar 6, 2027'},
];

let activeDay=new Date().getDay();
activeDay=activeDay===0?6:activeDay-1;

function daysUntil(){return Math.ceil((new Date('2027-03-06')-new Date())/(1000*60*60*24))}
function getWeekDates(){
  const now=new Date(),day=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.getDate()});
}
function getLog(day,i){try{return JSON.parse(localStorage.getItem(`log_${day}_${i}`)||'null')}catch{return null}}
function setLog(day,i,data){try{localStorage.setItem(`log_${day}_${i}`,JSON.stringify(data))}catch{}}
function getGear(day){try{return JSON.parse(localStorage.getItem(`gear_${day}`)||'[]')}catch{return[]}}
function setGear(day,arr){try{localStorage.setItem(`gear_${day}`,JSON.stringify(arr))}catch{}}

function renderTabs(){
  const dates=getWeekDates();
  document.getElementById('dayTabs').innerHTML=DAYS.map((d,i)=>`
    <button class="tab ${i===activeDay?'active':''}" onclick="switchDay(${i})"
      style="${i===activeDay?`background:${DAY_COLORS[d]};border-color:${DAY_COLORS[d]}`:''}">
      <span class="tab-day">${d.slice(0,3)}</span>
      <span class="tab-date">${dates[i]}</span>
    </button>`).join('');
}
function switchDay(i){activeDay=i;renderTabs();renderDay()}

function renderDay(){
  const dayName=DAYS[activeDay];
  const plan=PLAN[dayName];
  const tint=DAY_TINTS[dayName];
  const main=document.getElementById('main');

  if(dayName==='Sunday'){
    let html=`
      <div class="race-banner">
        <div class="race-label-top">Upcoming milestones</div>
        ${UPCOMING.map(r=>`<div class="race-item"><span class="race-icon">${r.icon}</span><span class="race-name">${r.name}</span><span class="race-date">${r.date}</span></div>`).join('')}
      </div>
      <div class="rest-card">
        <div class="rest-emoji">😴</div>
        <div class="rest-title">Full rest day</div>
        <div class="rest-sub">Adaptation happens here. Light walk only if needed.<br><br>Sunday PM — check in with Claude, review last week, plan the week ahead.</div>
      </div>`;
    if(plan.gear){
      const checked=getGear(dayName);
      html+=`<div class="gear-section"><div class="gear-title">${plan.gear.label}</div>${plan.gear.items.map((item,i)=>{const isC=checked.includes(i);return`<div class="gear-item" onclick="toggleGear('${dayName}',${i})"><div class="gear-check ${isC?'checked':''}" id="gcheck_${dayName}_${i}">${isC?'✓':''}</div><span class="gear-name ${isC?'checked':''}" id="gname_${dayName}_${i}">${item}</span></div>`;}).join('')}<span class="gear-reset" onclick="resetGear('${dayName}')">Reset list</span></div>`;
    }
    if(plan.recipe){
      const r=plan.recipe;
      html+=`<div class="recipe-section"><div class="recipe-title">${r.title}</div><ul class="recipe-items">${r.items.map(i=>`<li>${i}</li>`).join('')}</ul><div class="recipe-step">${r.step}</div><div style="font-size:11px;color:var(--muted);margin-bottom:6px">Per jar (÷6):</div><div class="macro-row">${r.macros.map(m=>`<span class="macro-pill">${m}</span>`).join('')}</div></div>`;
    }
    main.innerHTML=html;
    return;
  }

  let html=`<div class="day-header"><div class="day-name">${dayName}</div><div class="day-subtitle">${plan.subtitle}</div></div>`;
  if(plan.weekNote) html+=`<div class="week-note">⚠️ ${plan.weekNote}</div>`;

  plan.sessions.forEach((s,i)=>{
    const log=getLog(dayName,i);
    const isDone=log&&log.done;
    html+=`<div class="session" style="background:${tint}"><div class="session-header" onclick="toggleSession('${dayName}',${i})"><div class="session-color" style="background:${s.color}"></div><div class="session-meta"><div class="session-time">${s.time}</div><div class="session-title">${s.title}</div><div class="session-summary">${s.summary}</div></div><div class="session-chevron" id="chev_${dayName}_${i}">⌄</div></div><div class="session-detail" id="det_${dayName}_${i}"><div style="color:#ccc;font-size:13px;line-height:1.7">${s.detail}</div>${s.zone?`<span class="zpill ${s.zone}">${s.zone==='z2'?'Zone 2 — easy aerobic':s.zone==='z3'?'Zone 3 — steady aerobic':s.zone==='z4'?'Zone 3-4 — threshold':'Technique focus'}</span>`:''}<button class="log-btn ${isDone?'done':''}" id="logbtn_${dayName}_${i}" onclick="toggleLog('${dayName}',${i})">${isDone?'✓ Done — tap to edit':'Mark as done / add note'}</button><textarea class="log-area" id="logarea_${dayName}_${i}" rows="3" placeholder="What did you actually do? Notes, how it felt, any deviations...">${log&&log.note?log.note:''}</textarea><button class="save-btn" id="savebtn_${dayName}_${i}" onclick="saveLog('${dayName}',${i})">Save</button></div></div>`;
  });

  if(plan.nightly&&plan.nightly.length){
    html+=`<div class="nightly"><div class="nightly-title">Tonight</div><div class="nightly-items">${plan.nightly.map(n=>`<span class="nightly-pill">${n}</span>`).join('')}</div></div>`;
  }
  if(plan.gear){
    const checked=getGear(dayName);
    html+=`<div class="gear-section"><div class="gear-title">${plan.gear.label}</div>${plan.gear.items.map((item,i)=>{const isC=checked.includes(i);return`<div class="gear-item" onclick="toggleGear('${dayName}',${i})"><div class="gear-check ${isC?'checked':''}" id="gcheck_${dayName}_${i}">${isC?'✓':''}</div><span class="gear-name ${isC?'checked':''}" id="gname_${dayName}_${i}">${item}</span></div>`;}).join('')}<span class="gear-reset" onclick="resetGear('${dayName}')">Reset list</span></div>`;
  }
  main.innerHTML=html;
}

function toggleSession(day,i){document.getElementById(`det_${day}_${i}`).classList.toggle('open');document.getElementById(`chev_${day}_${i}`).classList.toggle('open')}
function toggleLog(day,i){document.getElementById(`logarea_${day}_${i}`).classList.toggle('open');document.getElementById(`savebtn_${day}_${i}`).classList.toggle('open')}
function saveLog(day,i){
  const note=document.getElementById(`logarea_${day}_${i}`).value;
  setLog(day,i,{done:true,note});
  const btn=document.getElementById(`logbtn_${day}_${i}`);
  btn.className='log-btn done';btn.textContent='✓ Done — tap to edit';
  document.getElementById(`logarea_${day}_${i}`).classList.remove('open');
  document.getElementById(`savebtn_${day}_${i}`).classList.remove('open');
}
function toggleGear(day,i){
  let checked=getGear(day);
  if(checked.includes(i))checked=checked.filter(x=>x!==i);else checked.push(i);
  setGear(day,checked);
  const chk=document.getElementById(`gcheck_${day}_${i}`);
  const nm=document.getElementById(`gname_${day}_${i}`);
  if(checked.includes(i)){chk.className='gear-check checked';chk.textContent='✓';nm.className='gear-name checked';}
  else{chk.className='gear-check';chk.textContent='';nm.className='gear-name';}
}
function resetGear(day){setGear(day,[]);renderDay()}

document.getElementById('daysCount').textContent=daysUntil();
renderTabs();
renderDay();
</script>
</body>
</html>
